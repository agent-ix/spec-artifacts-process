[package]
name = "spec-artifacts-process-assurance"
version = "0.1.0"
edition = "2024"
rust-version = "1.98.1"
license = "AGPL-3.0-or-later"
description = "Rust acceptance checks for the spec-artifacts-process module"
publish = false

[[test]]
name = "catalogue_contract"
path = "rust-tests/catalogue_contract.rs"

[dev-dependencies]
ix-trace-rs = { git = "https://github.com/agent-ix/ix-trace-rs", tag = "v0.1.1", version = "=0.1.0" }
serde = { version = "=1.0.229", features = ["derive"] }
yaml_serde = "=0.10.7"

[workspace.lints.rust]
missing_docs = "deny"
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "warn"
pedantic = "warn"

[lints]
workspace = true

[profile.release]
codegen-units = 1
lto = "thin"
