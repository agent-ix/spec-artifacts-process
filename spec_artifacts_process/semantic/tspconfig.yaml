emit:
  - "@typespec/json-schema"
options:
  "@typespec/json-schema":
    file-type: json
    emitAllModels: true
    emitAllRefs: true
    seal-object-schemas: true
    # Scratch only. `scripts/generate.mjs` overrides this with a tmpdir and
    # writes the bundle to `spec_artifacts_process/schemas/`; this default
    # exists so a bare `tsp compile` cannot drop the emitted files into the
    # package payload.
    emitter-output-dir: "{project-root}/.tsp-scratch"
