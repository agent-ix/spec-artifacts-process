manifest_version: 1.0.0
name: spec-artifacts-process
version: 0.1.0
description: "Filament Module: process artifact templates (ADR, Plan, Task, Review, Finding, TestMatrix, Standard) \u2014 Jinja .md.j2 templates"
archetypes:
- kind: adr
  name: ADR
  doc_backed: true
  supports_membership: false
  composition:
    states:
    - proposed
    - accepted
    - superseded
    - rejected
- kind: plan
  name: Plan
  doc_backed: true
  supports_membership: true
  composition:
    expected_artifacts:
    - Task
- kind: review
  name: Review
  doc_backed: true
  supports_membership: true
  composition:
    expected_artifacts:
    - Finding
    nav:
      top_level: true
      order: 12
- kind: spec-review
  name: SpecReview
  doc_backed: true
  supports_membership: false
  composition:
    nav:
      top_level: true
      order: 13
- kind: test-matrix
  name: Test Matrix
  doc_backed: true
  supports_membership: false
- kind: standard
  name: Standard
  doc_backed: true
  supports_membership: false
grammars:
- name: process-artifacts
  version: 0.1.0
  description: Process artifacts grammar (ADR, plan, review, etc.)
  doc_kinds:
  - adr
  - plan
  - review
  - spec-review
  - test-matrix
  - standard
  - finding
  - feedback
artifact_types:
- name: ADR
  grammar_ref: process-artifacts
  frontmatter_schema_ref: schemas/adr-frontmatter.schema.json
  defaults:
    id_pattern: ADR-{next:03d}
  allowed_links:
  - supersedes
  - superseded_by
  - relates_to
  - depends_on
  examples: []
  lint_rules_ref: []
- name: Plan
  grammar_ref: process-artifacts
  frontmatter_schema_ref: schemas/plan-frontmatter.schema.json
  defaults:
    id_pattern: Plan-{next:03d}
  allowed_links:
  - contains
  - depends_on
  - references
  examples: []
  lint_rules_ref: []
- name: Task
  grammar_ref: process-artifacts
  frontmatter_schema_ref: schemas/task-frontmatter.schema.json
  defaults:
    id_pattern: Task-{next:03d}
  allowed_links:
  - depends_on
  - verifies
  - references
  examples: []
  lint_rules_ref: []
- name: Review
  grammar_ref: process-artifacts
  frontmatter_schema_ref: schemas/review-frontmatter.schema.json
  defaults:
    id_pattern: Review-{next:03d}
  allowed_links:
  - reviews
  - references
  examples: []
  lint_rules_ref: []
- name: SpecReview
  grammar_ref: process-artifacts
  frontmatter_schema_ref: schemas/spec-review-frontmatter.schema.json
  defaults:
    id_pattern: SR-{next:03d}
  allowed_links:
  - reviews
  - references
  examples: []
  lint_rules_ref: []
  body_extraction:
    yield_pattern:
      match:
        summary:
          from: section_body
          after_heading: Summary
          required: true
        findings:
          from: table_row
          under_section: Findings
          required: true
          multiple: true
          assert:
            columns: [ID, Severity, Summary, Refs]
            min_rows: 1
            id_column: ID
            id_pattern: '^FND-\d+$'
            column_choices:
              Severity: [low, medium, high]
- name: Finding
  grammar_ref: process-artifacts
  frontmatter_schema_ref: schemas/finding-frontmatter.schema.json
  defaults:
    id_pattern: Finding-{next:03d}
  allowed_links:
  - found_in
  - blocks
  - references
  examples: []
  lint_rules_ref: []
- name: Feedback
  grammar_ref: process-artifacts
  frontmatter_schema_ref: schemas/feedback-frontmatter.schema.json
  defaults:
    id_pattern: FB-{next:03d}
  allowed_links:
  - references
  - found_in
  examples: []
  lint_rules_ref: []
  body_extraction:
    yield_pattern:
      match:
        comment:
          from: section_body
          after_heading: Comment
          required: true
- name: TestMatrix
  grammar_ref: process-artifacts
  frontmatter_schema_ref: schemas/testmatrix-frontmatter.schema.json
  defaults:
    id_pattern: TestMatrix-{next:03d}
  allowed_links:
  - covers
  - references
  examples: []
  lint_rules_ref: []
  # FR-003: structural + vocabulary contract over the matrix the quoin
  # `spec-matrix` template emits. Whether a referenced requirement id exists is
  # the engine's cross-reference job, not this contract's.
  body_extraction:
    yield_pattern:
      match:
        functional_coverage:
          from: table_row
          under_section: Functional Requirement Coverage
          required: true
          multiple: true
          assert:
            columns: [Functional Req, Acceptance Criteria, Test Cases, Coverage Status]
            min_rows: 1
        test_cases:
          from: table_row
          under_section: Test Case Summary
          required: true
          multiple: true
          assert:
            columns: [Test ID, Title, Type, Priority, Traces To, Status]
            # CR-018: `Priority` is the one asserted column much of the corpus
            # never authored — 49 of 169 ecosystem matrices carry real test-case
            # rows with no priority anywhere. Requiring it would either fail all
            # 49 forever or force an invented priority into each. The column
            # stays declared, and its values stay constrained when authored;
            # only its presence is optional (quire-rs FR-033-AC-14/15).
            optional_columns: [Priority]
            min_rows: 1
            id_column: Test ID
            # CR-016: segmented ids the ecosystem authors (TC-060-01,
            # TC-SB-001, TC-001-HEADER-PARSE) are legal; TC1 / tc-001 / TC- /
            # TCX-001 and ids carrying prose are not.
            #
            # CR-019: the prefix set mirrors the declared *evidence archetypes*
            # — `TC` and `IT` are the only two artifact types any module mints
            # test ids for (spec-artifacts-iso `id_pattern: TC-{next:03d}` /
            # `IT-{next:03d}`). It is deliberately not a list of test kinds:
            # what kind of testing a row records is the `Type` column's job,
            # and that vocabulary is open. A new technique is a new `Type`
            # value, not a new prefix.
            id_pattern: '^(TC|IT)(-[A-Za-z0-9]+)*-\d+[A-Za-z0-9]*(-[A-Za-z0-9]+)*$'
            column_choices:
              # Core evidence vocabulary + this module's declared extensions.
              # The list mirrors `traceability.vocabularies.test_type`, which is
              # the single source; `test_manifest.py` asserts they agree.
              Type: [Unit, Integration, E2E, Property, Fuzz, Benchmark, Static, Compile, Snapshot, Manual, Eval]
              Priority: [P0, P1, P2, P3, P4]
            column_patterns:
              # A leading status marker, optionally followed by the note that
              # says why (`⚠️ scale evidence deferred`). Classes live in
              # `traceability.status`.
              Status: '^(✅|⚠️|❌|🚧|⛔)(\s+.*)?$'
              # Comma-separated `<KIND>-<N>` tokens with an optional
              # `-<SUBKIND>-<M>` sub-id. The contract enumerates no kind names:
              # the legal set follows from the declared trace targets, and
              # existence is checked by reference resolution, not here. A
              # same-prefix range or a trailing parenthetical note is allowed.
              #
              # CR-017 admits two authoring shorthands the sweep found in real
              # matrices (report: reports/2026-08-06-fr003-signoff-gate.md):
              #   * continuation, where the parent id is elided —
              #     `FR-001-AC-2, -AC-3, -AC-4`
              #   * slash enumeration of sub-ids — `FR-016-AC-1/2/3/6`
              # Both mean exactly what the expanded list means. Deliberately NOT
              # admitted: an empty cell or `—`. A test case that traces to
              # nothing is what a traceability matrix exists to catch.
              Traces To: '^[A-Za-z]+-\d+(-[A-Za-z]+-\d+(/\d+)*)?(\.\.[A-Za-z]+-\d+(-[A-Za-z]+-\d+)?)?( \([^)]*\))?(, (-[A-Za-z]+-\d+(/\d+)*|[A-Za-z]+-\d+(-[A-Za-z]+-\d+(/\d+)*)?(\.\.[A-Za-z]+-\d+(-[A-Za-z]+-\d+)?)?)( \([^)]*\))?)*$'
        # Optional: the spec-matrix template emits these unconditionally, but a
        # bundle with no StR/US/NFR artifacts cannot truthfully populate them.
        # Absent is fine; present is asserted.
        stakeholder_coverage:
          from: table_row
          under_section: Stakeholder Requirement Coverage
          required: false
          multiple: true
          assert:
            columns: [Stakeholder Req, Trace to US/FR, Test/Validation, Coverage Status]
        user_story_coverage:
          from: table_row
          under_section: User Story Coverage
          required: false
          multiple: true
          assert:
            columns: [User Story, Acceptance Criteria, Test Cases, Coverage Status]
        non_functional_coverage:
          from: table_row
          under_section: Non-Functional Requirement Coverage
          required: false
          multiple: true
          assert:
            columns: [Non-Functional Req, Verification Method, Evidence/Test Cases, Status]
- name: Standard
  grammar_ref: process-artifacts
  frontmatter_schema_ref: schemas/standard-frontmatter.schema.json
  defaults:
    id_pattern: Standard-{next:03d}
  allowed_links:
  - references
  examples: []
  lint_rules_ref: []
# ── Evidence layer (agent-ix/spec-artifacts-process#34, ADR-0011) ─────────
# The AUTHORED half of the evidence store. The machine-transcribed half —
# bindings.json, baseline.json, runs/** — is typeless and corpus-invisible by
# design, and its schemas are owned by quoin (agent-ix/quoin#79).
- name: SuiteRegistry
  grammar_ref: process-artifacts
  frontmatter_schema_ref: schemas/suite-registry-frontmatter.schema.json
  defaults:
    id_pattern: SUR-{next:03d}
  # The suite is the atomic unit of evidence: one run file per (suite, commit),
  # aggregation is a view, and a partial run must never masquerade as a full
  # one — the `make ci` / `make ci-python` split already caused exactly that rot
  # (quire-rs TC-715).
  body_extraction:
    yield_pattern:
      match:
        suites:
          from: table_row
          under_section: Suites
          required: true
          multiple: true
          assert:
            columns:
            - ID
            - Name
            - Command
            - Tool
            - Evidence Kind
            min_rows: 1
            id_column: ID
            # Structured, doc-scoped, never renumbered. Deliberately NOT a
            # kebab slug: everything joins on this id — run directories,
            # bindings, freshness — and policy-immutable semantic strings are
            # what produced the 1,014 dead tags (quire-rs#72).
            id_pattern: "^SUITE-\\d+$"
            column_choices:
              # CR-015: the SAME vocabulary as the Test Matrix `Type` column and
              # the obligation record's method. One vocabulary, three uses. The
              # tool lives in its own column, so an adapter-fed kind (semgrep,
              # SARIF, SBOM) needs no per-tool vocabulary entry — `Evidence
              # Kind` stays method-class-shaped. Restated rather than
              # referenced because `from_vocabulary` does not exist yet
              # (quire-rs#146); the FR-003 manifest test keeps the copies honest
              # until it does.
              Evidence Kind:
              - Unit
              - Integration
              - E2E
              - Property
              - Fuzz
              - Benchmark
              - Static
              - Compile
              - Snapshot
              - Manual
              - Eval
  allowed_links: []
  examples: []
  lint_rules_ref: []
- name: Inspections
  grammar_ref: process-artifacts
  frontmatter_schema_ref: schemas/inspections-frontmatter.schema.json
  defaults:
    id_pattern: INS-{next:03d}
  # Inspection and Analysis evidence acts — the methods that produce no source
  # symbol and so can never be discharged by a test run (the CR-041
  # `no_source_symbol` class). Authored markdown rather than machine JSON,
  # because a human performed the act and the record of who, when, and against
  # which commit IS the evidence.
  body_extraction:
    yield_pattern:
      match:
        inspections:
          from: table_row
          under_section: Inspections
          required: true
          multiple: true
          assert:
            columns:
            - ID
            - Obligation
            - Who
            - Commit
            - Verdict
            - Note
            optional_columns:
            - Note
            min_rows: 1
            id_column: ID
            id_pattern: "^INSP-\\d+$"
            column_choices:
              Verdict:
              - Pass
              - Fail
              - Waived
  allowed_links: []
  examples: []
  lint_rules_ref: []
doc_kinds:
- adr
- plan
- review
- spec-review
- test-matrix
- standard
- finding
- feedback
object_types:
- name: standard
  data_schema:
    type: object
    properties:
      code:
        type: string
      name:
        type: string
      description:
        type: string
      guide:
        type: string
      link:
        type: string
    required:
    - code
  body_extraction:
    yield_pattern:
      match:
        id:
          from: frontmatter_field
          path:
          - id
          required: false
        title:
          from: frontmatter_field
          path:
          - title
          required: false
        type:
          from: frontmatter_field
          path:
          - type
          required: false
        code:
          from: frontmatter_field
          path:
          - code
          required: true
        name:
          from: frontmatter_field
          path:
          - name
          required: false
        link:
          from: frontmatter_field
          path:
          - link
          required: false
        description:
          from: section_body
          after_heading: Description
          required: false
        guide:
          from: section_body
          after_heading: Application Guidance
          required: false
  allowed_links:
    references: []
lint_rules: []

# ── Traceability model (quire-rs FR-050) ──────────────────────────────────
# The single source for what this module's matrix columns mean. The TestMatrix
# `body_extraction` above validates the *shape*; these declarations tell the
# coverage rollup how to read the same columns, so a contract and its coverage
# computation cannot drift (CR-015 / CR-016).
traceability:
  # ── What mints trace ids ──
  #
  # The Test Matrix is bound by **archetype**, and the fixture problem is solved
  # by `exclude:` rather than by enumeration (quire-rs CR-062, #74).
  #
  # This reverses #22 decision 4, because both halves of that finding changed:
  #
  #   * `archetype: TestMatrix` could not see the canonical matrix at all — the
  #     corpus walk skipped every file named `tests.md` (quire-rs
  #     `corpus/walk.rs` `DEFAULT_SKIP`). Type-driven corpus membership
  #     (quire-rs #73, v0.26.0) removed that skip, so the premise is gone.
  #   * Archetype binding still sees matrices that are *test data* — scanning
  #     this module's own repo by archetype minted 67 test-case ids from
  #     `tests/fixtures/testmatrix/*.md` and reported 50 of them "backed",
  #     because a fixture reusing `TC-017` collides with the real one. That is
  #     what `exclude:` is for, and it is now load-bearing rather than optional.
  #
  # Enumeration was the cost of the old form: three near-identical entries, one
  # per filename the ecosystem happens to use, reaching nothing nested. A matrix
  # at `spec/<module>/matrix/tests.md` minted zero ids however correctly it was
  # authored. Measured across ~/dev, 238 repos, worktrees deduped: this collapse
  # takes ecosystem dead trace tags from 1,401 occurrences / 1,052 distinct ids
  # to 1,207 / 873, and `filament-ide-rs` from 214 dead tags to 20 with its
  # rollup going 17/850 -> 473/2,184 rows backed.
  #
  # Collapsing the *references* matters as much as the target: rebinding
  # `test-case` alone leaves 49 dead tags there, because `traces-to` and
  # `functional-coverage` were path-bound too and could not read the nested
  # matrices they describe.
  #
  # Nine declarations collapse to three. `spec/matrix.md` and `spec/evals.md`
  # need no entry of their own: a matrix is reached by what it *is*, not by what
  # it is called.
  trace_targets:
  - name: test-case
    archetype: TestMatrix
    exclude: ['tests/**', 'tests_integration/**', 'fixtures/**']
    section: Test Case Summary
    id_column: Test ID
  - name: acceptance-criterion
    archetype: FR
    exclude: ['tests/**', 'tests_integration/**', 'fixtures/**']
    section: Acceptance Criteria
    id_column: ID
  - name: nfr-acceptance-criterion
    archetype: NFR
    exclude: ['tests/**', 'tests_integration/**', 'fixtures/**']
    section: Acceptance Criteria
    id_column: ID
  # ── Evidence layer (#34) ──
  #
  # Declaring the suite registry as a trace target is what makes `SUITE-N` a
  # **referenceable id class**: FR-049's `dangling-trace-reference` then covers
  # every reference to a suite for free, so a binding or a run directory naming
  # a suite that no longer exists is reported rather than silently orphaned.
  - name: suite
    archetype: SuiteRegistry
    exclude:
    - tests/**
    - tests_integration/**
    - fixtures/**
    section: Suites
    id_column: ID
  - name: inspection
    archetype: Inspections
    exclude:
    - tests/**
    - tests_integration/**
    - fixtures/**
    section: Inspections
    id_column: ID
  # Requirement documents stay archetype-bound — but archetype binding requires
  # scope exclusion, because fixtures are legitimately typed. A test fixture
  # that exercises the `FR` contract *is* `type: FR`; that is what makes it a
  # fixture. `quire-cli/tests/fixtures/validate-mod/docs/valid-fr.md` is
  # `type: FR, id: FR-001` with an `## Acceptance Criteria` table minting
  # `FR-001-AC-1`/`-AC-2`, colliding with the real `FR-001` in `quire-cli/spec/`
  # — siblings `broken-fr.md`, `placeholder-fr.md`, `override-fr.md`,
  # `missing-section-fr.md`, `unknown-object-fr.md`, `lint-mod/docs/*.md`,
  # `iso-docs/{FR,NFR}-*.md`. `quire coverage --scope` defaults to the repo
  # root, so this is the *default* invocation, not an opt-in one.
  #
  # The same failure the `tests/fixtures/testmatrix/*.md` incident produced (67
  # phantom ids, 50 reported "backed", recorded below). That one was fixed by
  # switching to path binding; these targets get the exclusion instead, because
  # `FR`/`NFR` have no canonical single path to bind to.
  #
  # Deliberately not minted: `US` criteria are authored as a bullet list, not a
  # table, and `declared_tables::scan` reads tables only; `StR` criteria sit
  # under `## Validation Criteria` with a `Validation` column and are validated
  # by review rather than by a test. Neither is a denominator a test tag could
  # ever satisfy, and a denominator nothing can satisfy is noise.

  # ── What references those ids ──
  #
  # `expand_ranges` and `strip_annotations` are opt-in per declaration
  # (FR-050-AC-12) and both are needed here: the corpus authors
  # `FR-001-AC-1 .. FR-001-AC-4` and `TC-024 (blocked: no uniqueness assert)`.
  #
  # Known limit, recorded rather than papered over: the two CR-017 authoring
  # shorthands the *shape* contract admits — continuation (`FR-001-AC-2, -AC-3`)
  # and slash enumeration (`FR-016-AC-1/2/3`) — are not expanded by the engine,
  # so such a cell contributes its first token only. The row is still backed
  # when that token is backed; it just under-counts the rest.
  document_references:
  # An inspection names the obligation it discharges. Reusing the existing
  # criterion targets means a typo in that cell dangles like any other broken
  # reference, instead of recording an act against nothing (#34).
  - name: inspection-obligation
    archetype: Inspections
    exclude:
    - tests/**
    - tests_integration/**
    - fixtures/**
    section: Inspections
    column: Obligation
    row_id_column: ID
    pattern: "\\b([A-Za-z]{2,4}-\\d+(?:-[A-Za-z]+-\\d+)?)\\b"
    targets:
    - acceptance-criterion
    - nfr-acceptance-criterion
    expand_ranges: false
    strip_annotations: true
  # Most `Verification` cells carry no test id at all — a sweep over quire-rs,
  # quoin and this repo found 285 bare `Test`, 99 `Test (TC-nnn)`, and ~100
  # naming a file rather than an id (`Test (org.test.ts)`), plus `Eval (EV-nnn)`.
  # The pattern extracts what is there; a row naming no id is still answerable
  # for its own criterion id, which is what a tag on the test binds.
  - name: verification
    archetype: FR
    exclude: ['tests/**', 'tests_integration/**', 'fixtures/**']
    section: Acceptance Criteria
    column: Verification
    row_id_column: ID
    pattern: '\b((?:TC|IT)(?:-[A-Za-z0-9]+)*-\d+[A-Za-z0-9]*)\b'
    targets: [test-case]
    expand_ranges: true
    strip_annotations: false
  - name: nfr-verification
    archetype: NFR
    exclude: ['tests/**', 'tests_integration/**', 'fixtures/**']
    section: Acceptance Criteria
    column: Verification
    row_id_column: ID
    pattern: '\b((?:TC|IT)(?:-[A-Za-z0-9]+)*-\d+[A-Za-z0-9]*)\b'
    targets: [test-case]
    expand_ranges: true
    strip_annotations: false
  - name: traces-to
    archetype: TestMatrix
    exclude: ['tests/**', 'tests_integration/**', 'fixtures/**']
    section: Test Case Summary
    column: Traces To
    row_id_column: Test ID
    pattern: '\b([A-Za-z]{2,4}-\d+(?:-[A-Za-z]+-\d+)?)\b'
    targets: [acceptance-criterion, nfr-acceptance-criterion]
    expand_ranges: true
    strip_annotations: true
  - name: functional-coverage
    archetype: TestMatrix
    exclude: ['tests/**', 'tests_integration/**', 'fixtures/**']
    section: Functional Requirement Coverage
    column: Test Cases
    row_id_column: Functional Req
    pattern: '\b((?:TC|IT)(?:-[A-Za-z0-9]+)*-\d+[A-Za-z0-9]*)\b'
    targets: [test-case]
    expand_ranges: true
    strip_annotations: true

  # ── How a test carries a trace id (FR-051) ──
  #
  # FR-051 specified all three marker forms and deferred this declaration to
  # "a follow-up change in spec-artifacts-iso". It lands here instead: the rest
  # of the traceability model is already here, the TestMatrix that mints test
  # ids is this module's archetype, and splitting one model across two modules
  # would let the halves version apart (#22 decision 1).
  trace_tags:
    # Arguments must be **quoted**. `bind_symbol` scans a symbol's raw source
    # with no comment awareness, so a marker written in prose binds like a real
    # one: `#[trace(...)]` in a doc comment explaining the form minted a trace id
    # of literally `...`. Quoted-only admits every authored marker (FR-051 writes
    # them quoted, and `marker_ids` prefers the quoted reading) and rejects the
    # placeholder. A module wanting bare-identifier markers declares its own
    # pattern — the engine still supports them.
    markers:
    - name: rust-trace-attribute
      language: rust
      pattern: '#\[trace\(((?:\s*"[^"]*"\s*,?)+)\)\]'
      template: '#[trace({ids})]'
    - name: pytest-trace-marker
      language: python
      pattern: '@pytest\.mark\.trace\(((?:\s*"[^"]*"\s*,?)+)\)'
      template: '@pytest.mark.trace({ids})'
    - name: ts-trace-helper
      language: typescript
      pattern: '\btrace\(((?:\s*"[^"]*"\s*,?)+)\)'
      template: 'trace({ids})'
    # A legacy form names exactly one `rewrite_to` marker, so a form that spans
    # languages can only ever suggest the wrong syntax for two of the three —
    # the fixture points all of them at `rust-trace-attribute`, which would tell
    # a `.py` file to grow a Rust attribute. Split per language instead, so the
    # suggestion is valid in the file it is offered for (#22 decision 3).
    #
    # Every id group below is a **comma-separated list**, not a single id. The
    # form reads naturally as `// Trace: FR-001-AC-1, FR-001-AC-2` and the corpus
    # keeps writing it: [RAN] 98 such lines across ~/dev, worktrees and -task<N>
    # copies excluded, carried 205 ids that bound to nothing across 17 repos —
    # every declared shape here and all three languages. A single-id group
    # matches once and stops at the comma, so the rest was never *read*.
    #
    # The engine splits capture group 1 the way `marker_ids` already splits a
    # marker's argument list (quire-rs FR-051-AC-16, v0.21.0). Both halves are
    # required: widening alone would hand the engine one id of `"A, B"`, and
    # splitting alone finds nothing to split.
    #
    # `rust-test-name-id` is deliberately **not** widened — it declares
    # `id_format`, and `TC-{1}` renders over a function name, which cannot carry
    # a list. The engine leaves the template path unsplit for the same reason.
    #
    # The `*-comment-id` trailing delimiter still holds: it admits `,`, so a
    # greedy list consumes the separators and the delimiter falls through to the
    # real terminator. Verified against `// TC-033, TC-034`,
    # `// TC-033, TC-034: why`, `// TC-033 - prose`, `// TC-033, TC-034,` and
    # the quire-rs `// TC-480 / FR-025-AC-1: …` convention (which is `/`
    # separated, still binds TC-480 only, unchanged). The prose guard is intact:
    # `# FR-003-CON-1 sweep found in real matrices` still matches nothing.
    legacy:
    - name: rust-trace-line
      language: rust
      pattern: 'Trace:\s*([A-Za-z]+-\d+(?:-[A-Za-z]+-\d+)?(?:\s*,\s*[A-Za-z]+-\d+(?:-[A-Za-z]+-\d+)?)*)'
      rewrite_to: rust-trace-attribute
    - name: python-trace-line
      language: python
      pattern: 'Trace:\s*([A-Za-z]+-\d+(?:-[A-Za-z]+-\d+)?(?:\s*,\s*[A-Za-z]+-\d+(?:-[A-Za-z]+-\d+)?)*)'
      rewrite_to: pytest-trace-marker
    - name: typescript-trace-line
      language: typescript
      pattern: 'Trace:\s*([A-Za-z]+-\d+(?:-[A-Za-z]+-\d+)?(?:\s*,\s*[A-Za-z]+-\d+(?:-[A-Za-z]+-\d+)?)*)'
      rewrite_to: ts-trace-helper
    # The line-comment form requires the id to be **followed by punctuation** —
    # `:`, `/`, `(`, `,`, a dash, or end of line. That is what separates a tag
    # from prose that merely names a requirement.
    #
    # Measured, not guessed. quire-rs writes 344 of these and its convention is
    # an id *plus* prose — `// TC-480 / FR-025-AC-1: len == number of parsed
    # artifacts.` — so requiring a bare id would have discarded 64 real bindings
    # (148 backed rows down to 84). But an unanchored form binds prose: this
    # repo's own `# FR-003-CON-1 sweep found in real matrices` claimed a
    # constraint the test does not verify. It surfaced only because CON ids are
    # not minted; the same wrapped line naming an `-AC-` id would have marked
    # that criterion backed, silently. The delimiter admits every authored tag
    # in the corpus and rejects a sentence that flows through the id.
    - name: rust-comment-id
      language: rust
      pattern: '(?m)//\s*((?:TC|IT|FR|NFR|StR|US)-\d+(?:-[A-Za-z]+-\d+)?(?:\s*,\s*(?:TC|IT|FR|NFR|StR|US)-\d+(?:-[A-Za-z]+-\d+)?)*)\s*(?:[:,/()\[\]]|[-–—]\s|$)'
      rewrite_to: rust-trace-attribute
    - name: python-comment-id
      language: python
      pattern: '(?m)#\s*((?:TC|IT|FR|NFR|StR|US)-\d+(?:-[A-Za-z]+-\d+)?(?:\s*,\s*(?:TC|IT|FR|NFR|StR|US)-\d+(?:-[A-Za-z]+-\d+)?)*)\s*(?:[:,/()\[\]]|[-–—]\s|$)'
      rewrite_to: pytest-trace-marker
    - name: typescript-comment-id
      language: typescript
      pattern: '(?m)//\s*((?:TC|IT|FR|NFR|StR|US)-\d+(?:-[A-Za-z]+-\d+)?(?:\s*,\s*(?:TC|IT|FR|NFR|StR|US)-\d+(?:-[A-Za-z]+-\d+)?)*)\s*(?:[:,/()\[\]]|[-–—]\s|$)'
      rewrite_to: ts-trace-helper
    - name: rust-test-name-id
      language: rust
      pattern: '\bfn (?i:tc)(\d+)_'
      id_format: 'TC-{1}'
      rewrite_to: rust-trace-attribute
    # FR-051-AC-11's fourth form, "docstring bare id". Anchored to the *first*
    # token of the doc comment, which is the authored convention across the
    # corpus (`"""TC-017 (FR-003-AC-9): the contract is additive."""`). An
    # unanchored form would bind every id a docstring merely mentions in prose,
    # and a test that names a requirement is not a test that verifies it.
    - name: python-docstring-id
      language: python
      pattern: '(?m)^\s*(?:[rbfu]{1,2})?"""\s*((?:TC|IT|FR|NFR|StR|US)-\d+(?:-[A-Za-z]+-\d+)?(?:\s*,\s*(?:TC|IT|FR|NFR|StR|US)-\d+(?:-[A-Za-z]+-\d+)?)*)'
      rewrite_to: pytest-trace-marker
    - name: rust-doc-comment-id
      language: rust
      pattern: '(?m)^\s*///\s*((?:TC|IT|FR|NFR|StR|US)-\d+(?:-[A-Za-z]+-\d+)?(?:\s*,\s*(?:TC|IT|FR|NFR|StR|US)-\d+(?:-[A-Za-z]+-\d+)?)*)'
      rewrite_to: rust-trace-attribute
    - name: typescript-doc-comment-id
      language: typescript
      pattern: '(?m)^\s*\*\s*((?:TC|IT|FR|NFR|StR|US)-\d+(?:-[A-Za-z]+-\d+)?(?:\s*,\s*(?:TC|IT|FR|NFR|StR|US)-\d+(?:-[A-Za-z]+-\d+)?)*)'
      rewrite_to: ts-trace-helper
  status:
    column: Status
    complete: ["✅"]
    pending: ["🚧"]
    failed: ["❌"]
    retired: ["⛔"]
  # ── What states an obligation (quire-rs FR-053) ──
  #
  # An obligation is DERIVED, never authored: choosing an acceptance criterion's
  # `Verification` method IS minting it. Without these declarations the engine's
  # obligation machinery is inert — it ships and derives nothing — which is why
  # they land with the evidence layer rather than after it.
  obligations:
  - name: acceptance-criterion
    target: acceptance-criterion
    statement_column: Criteria
    method_column: Verification
  - name: nfr-acceptance-criterion
    target: nfr-acceptance-criterion
    statement_column: Criteria
    method_column: Verification
  # The second source, and not an afterthought: an NFR `Measurement and
  # Evaluation` row states one number three times over — the spec threshold, the
  # benchmark assertion and the evidence gate are the same quantity. Its rows
  # carry no id of their own, which is why `id_format` exists.
  - name: nfr-metric
    archetype: NFR
    section: Measurement and Evaluation
    id_format: "{document}-M-{row}"
    statement_column: Metric
    method_column: Method
    parameters:
      target: Target
      threshold: Threshold
  vocabularies:
    test_type: [Unit, Integration, E2E, Property, Fuzz, Benchmark, Static, Compile, Snapshot, Manual, Eval]
    # CR-002: which column carries the value above, and which of those values
    # name a verification method that mints no source symbol (quire-rs
    # FR-050-AC-16).
    #
    # An `Eval` is an agent driven against a live scenario; a `Manual` step is a
    # person. Neither produces a symbol a trace tag could attach to, so a row
    # verified that way can never be backed — and reporting it as a status lie
    # asserts something its own declared method makes impossible. The row still
    # counts as unbacked; only the accusation is withdrawn.
    #
    # Deliberately NOT listed: `Static`, `Benchmark` and `Compile`. Each is
    # usually asserted by real code — this repo's own static boundary audit is a
    # test — so exempting them would hide overclaims rather than explain them.
    test_type_column: Type
    no_source_symbol: [Eval, Manual]

# ── Verification-method catalog (quire-rs FR-054, #35) ────────────────────────
# The 29119-4-shaped answer to "how should this requirement be verified".
# Before this, the knowledge was prose: IADT lived in two spec-artifacts-iso
# lint rules, techniques in `traceability.vocabularies.test_type`, and quoin's
# spec-evidence-analysis skill assigned a method per requirement from a
# skill-local table that no manifest declared and no code read.
#
# `class` is the ISO 29148 IADT axis. The engine treats it as a free string
# (quire-rs FR-054-CON-1) — this module chooses IADT; another may not.
#
# `evidence_kind` is drawn from `traceability.vocabularies.test_type` below —
# the SAME vocabulary the Test Matrix `Type` column and the suite registry's
# `Evidence Kind` use (CR-015: one vocabulary, several uses). It is
# method-class-shaped on purpose: the TOOL lives in the suite registry's own
# `tool` column, so semgrep, an SBOM generator and a DAST scanner need no
# vocabulary entries of their own. Restated rather than referenced because
# `from_vocabulary` is deferred (quire-rs#146); TC-048 keeps the two honest.
#
# `applicability` rule names are this module's axes. The engine stores and
# surfaces them and interprets none (FR-054-CON-2) — deciding which requirement
# a rule matches is the advisor's judgement (agent-ix/quoin#89).
verification_catalog:

  # ── Test: execution against the running system ──
  unit-testing:
    name: Unit testing
    class: Test
    definition: >-
      Exercise one unit in isolation against a fixed expected result.
    evidence_kind: Unit
    applicability:
      property_shapes: [example]
      characteristics: [single-component]
    tooling: [cargo test, pytest, jest]
  integration-testing:
    name: Integration testing
    class: Test
    definition: >-
      Exercise two or more components across their real boundary, without
      substituting the boundary itself.
    evidence_kind: Integration
    applicability:
      characteristics: [cross-component, io-boundary]
    tooling: [pytest, testcontainers]
  e2e-testing:
    name: End-to-end testing
    class: Test
    definition: >-
      Drive the assembled system through the interface a user or caller uses.
    evidence_kind: E2E
    applicability:
      characteristics: [user-visible, workflow]
    tooling: [playwright, cypress]
  property-based-testing:
    name: Property-based testing
    class: Test
    definition: >-
      Execute a property over generated inputs, asserting an invariant that
      holds for every input rather than a fixed expected value.
    evidence_kind: Property
    applicability:
      property_shapes: [universal, invariant, round-trip, idempotence, ordering]
      characteristics: [universally-quantified]
    tooling: [proptest, fast-check, hypothesis]
  metamorphic-testing:
    name: Metamorphic testing
    class: Test
    definition: >-
      Assert a relation between the outputs of two related executions, for a
      requirement whose correct output cannot be stated independently.
    evidence_kind: Property
    applicability:
      property_shapes: [round-trip, idempotence, ordering]
      characteristics: [no-independent-oracle]
    tooling: [proptest, hypothesis]
  model-based-test-generation:
    name: Model-based test generation
    class: Test
    definition: >-
      Derive test cases from a state or protocol model rather than authoring
      them, so the generated set covers the model's transitions.
    evidence_kind: Property
    applicability:
      property_shapes: [lifecycle]
      characteristics: [state-machine, protocol]
    tooling: [proptest state machine, stateful hypothesis]
  combinatorial-tway:
    name: Combinatorial t-way testing
    class: Test
    definition: >-
      Cover every t-way combination of declared configuration dimensions,
      rather than every combination or one arbitrary combination.
    evidence_kind: Property
    applicability:
      characteristics: [configuration-matrix, feature-flags]
    tooling: [PICT, ACTS]
  mutation-testing:
    name: Mutation testing
    class: Test
    definition: >-
      Seed faults into the implementation and measure whether the existing
      suite detects them — a test of the tests, not of the code.
    evidence_kind: Static
    applicability:
      characteristics: [high-criticality, suite-quality-unknown]
    tooling: [cargo-mutants, mutmut, stryker]
  fuzzing:
    name: Fuzzing
    class: Test
    definition: >-
      Execute the input surface against generated or mutated data, looking for
      crashes, hangs and assertion failures rather than wrong answers.
    evidence_kind: Fuzz
    applicability:
      characteristics: [untrusted-input, parser, deserializer]
    tooling: [cargo-fuzz, libFuzzer, AFL++]
  grammar-based-fuzzing:
    name: Grammar-based fuzzing
    class: Test
    definition: >-
      Fuzz with inputs generated from a grammar, so the generated data reaches
      past the parser into the logic behind it.
    evidence_kind: Fuzz
    applicability:
      characteristics: [structured-input, grammar-declared]
    tooling: [cargo-fuzz + arbitrary, Nautilus]
  concolic-execution:
    name: Concolic / symbolic execution
    class: Analysis
    definition: >-
      Explore execution paths symbolically to find inputs that reach a state,
      rather than sampling inputs and hoping one does.
    evidence_kind: Fuzz
    applicability:
      characteristics: [path-sensitive, hard-to-reach-branch]
    tooling: [CrossHair, KLEE, Kani]
  bdd-spec-by-example:
    name: Spec-by-example (BDD)
    class: Test
    definition: >-
      Execute the worked examples the requirement was specified with, so the
      example and the test are one artifact.
    evidence_kind: E2E
    applicability:
      property_shapes: [example]
      characteristics: [stakeholder-facing, workflow]
    tooling: [cucumber, behave]
  contract-testing:
    name: Consumer-driven contract testing
    class: Test
    definition: >-
      Assert that a provider's output satisfies the schema its consumers were
      written against, checked from both sides independently.
    evidence_kind: Integration
    applicability:
      characteristics: [published-interface, cross-repo-boundary]
    tooling: [pact, published JSON Schema]
  design-by-contract:
    name: Design by contract
    class: Test
    definition: >-
      Encode preconditions, postconditions and invariants as executable
      annotations on the implementation, checked wherever it runs.
    evidence_kind: Compile
    applicability:
      property_shapes: [invariant]
      characteristics: [precondition-bearing]
    tooling: [contracts crate, icontract]
  runtime-monitoring:
    name: Runtime verification / monitors
    class: Test
    definition: >-
      Check a temporal property continuously against a running system, for a
      requirement no single execution can discharge.
    evidence_kind: Integration
    applicability:
      characteristics: [temporal, liveness, invariance]
    tooling: [OpenTelemetry assertions, monitors]
  deterministic-simulation:
    name: Deterministic simulation
    class: Test
    definition: >-
      Run the system under a seeded, controlled scheduler so a concurrency
      failure reproduces exactly rather than intermittently.
    evidence_kind: Integration
    applicability:
      property_shapes: [concurrency]
      characteristics: [concurrent, distributed]
    tooling: [loom, madsim, FoundationDB-style simulation]
  fault-injection:
    name: Fault injection
    class: Test
    definition: >-
      Induce a failure the system claims to tolerate — a dropped connection, a
      full disk, a killed process — and observe that it does.
    evidence_kind: Integration
    applicability:
      # `hazard` and `failure_mode` are spec-objects-safety object types. A
      # declared failure mode names a failure the system can suffer, and a
      # hazard names a state that failure can reach — which is the applicability
      # question this method asks, already answered, in the document. The
      # `object_types` axis is the same one `attack_surface` already uses to
      # advise DAST/SAST/IAST (agent-ix/spec-objects-security#5).
      object_types: [hazard, failure_mode]
      characteristics: [reliability, fault-tolerance, degradation]
    tooling: [toxiproxy, chaos-mesh, fs fault injection]
  performance-benchmarking:
    name: Performance benchmarking
    class: Test
    definition: >-
      Measure a quantified metric against its declared target and threshold —
      the NFR measurement row, executed.
    evidence_kind: Benchmark
    applicability:
      characteristics: [latency, throughput, quantified-threshold]
    tooling: [criterion, pytest-benchmark, hyperfine]
  golden-approval-testing:
    name: Golden / approval testing
    class: Test
    definition: >-
      Compare output byte-for-byte against a reviewed, checked-in artifact, so
      an unintended change is a diff rather than a surprise.
    evidence_kind: Snapshot
    applicability:
      characteristics: [stable-output, serialization]
    tooling: [insta, syrupy, jest snapshots]
  negative-abuse-testing:
    name: Negative / abuse-case testing
    class: Test
    definition: >-
      Exercise the paths an adversary or a mistaken caller takes, asserting the
      system refuses rather than that it succeeds.
    evidence_kind: Integration
    applicability:
      object_types: [attack_surface, threat]
      characteristics: [security, input-validation]
    tooling: [pytest, integration harness]
  dast:
    name: Dynamic application security testing
    class: Test
    definition: >-
      Probe the running system's exposed surface for exploitable behaviour,
      from outside, without its source.
    evidence_kind: Integration
    applicability:
      object_types: [attack_surface]
      characteristics: [network-exposed, security]
    tooling: [ZAP, Burp]
  iast:
    name: Interactive application security testing
    class: Test
    definition: >-
      Observe the running system from inside during exercise, correlating
      requests with the code paths they reach.
    evidence_kind: Integration
    applicability:
      object_types: [attack_surface]
      characteristics: [security, instrumented]
    tooling: [Contrast, in-process agents]

  # ── Analysis: reasoning over the artifact without running it ──
  sast:
    name: Static application security testing
    class: Analysis
    definition: >-
      Match declared rules against source to find a defect class without
      executing it.
    evidence_kind: Static
    applicability:
      object_types: [attack_surface]
      characteristics: [security, injection-risk]
    tooling: [semgrep, CodeQL]
  sca-sbom:
    name: Software composition analysis / SBOM
    class: Analysis
    definition: >-
      Enumerate dependencies and check them against known-vulnerability and
      licence policy.
    evidence_kind: Static
    applicability:
      characteristics: [third-party-dependency, licence, supply-chain]
    tooling: [cargo-audit, cargo-deny, pip-audit, CycloneDX, SPDX]
  architecture-conformance:
    name: Architecture conformance
    class: Analysis
    definition: >-
      Check the implemented dependency structure against the declared one, so a
      layering rule is enforced rather than documented.
    evidence_kind: Static
    applicability:
      characteristics: [layering, module-boundary]
    tooling: [import-linter, cargo-deny bans, custom audit]
  # ── The two gaps the corpus found (agent-ix/spec-artifacts-process#43) ──
  #
  # quire-rs FR-054-AC-11 started reporting a declared method no catalog
  # carries, and the first sweep — quire-rs' own 20 NFR `Measurement and
  # Evaluation` tables, 55 rows — turned up 17 distinct strings. Fifteen were
  # a TOOL name (`Proptest`, `cargo-mutants`, `Criterion Benchmark`), a class
  # SYNONYM (`Unit Test`, `Static Inspection`) or a CADENCE (`CI Gate`,
  # `Scheduled CI Gate`) standing in for a method this catalog already carried.
  # Two were neither: the corpus was verifying things by means the catalog had
  # no word for.
  compile-time-check:
    name: Compile-time check
    class: Analysis
    definition: >-
      Encode the property so that violating it does not compile — a lint
      promoted to a hard error, a type that cannot represent the bad state, a
      const assertion. The evidence is that the build succeeded, and there is
      no runtime cost or runtime escape.
    evidence_kind: Compile
    applicability:
      characteristics: [memory-safety, invariance, layering]
      property_shapes: [invariant]
    tooling: ["#![forbid(unsafe_code)]", static_assertions, "mypy --strict", "tsc --strict"]
  dynamic-analysis-sanitizer:
    name: Dynamic analysis (sanitizers)
    class: Analysis
    definition: >-
      Run the program under an instrumented runtime that reports undefined
      behaviour, data races, leaks or use-after-free the source does not show
      and no assertion would catch. Distinct from fuzzing, which generates the
      inputs, and from static analysis, which never executes.
    evidence_kind: Integration
    applicability:
      characteristics: [memory-safety, concurrent, undefined-behaviour]
      property_shapes: [concurrency]
    tooling: [ThreadSanitizer, AddressSanitizer, MemorySanitizer, valgrind, Miri]
  static-quality:
    name: Static quality analysis (ISO 5055)
    class: Analysis
    definition: >-
      Measure structural quality weaknesses — complexity, coupling, known
      defect patterns — over the source.
    evidence_kind: Static
    applicability:
      characteristics: [maintainability, complexity]
    tooling: [clippy, ruff, sonarqube]
  formal-analysis-smt:
    name: Formal analysis (SMT)
    class: Analysis
    definition: >-
      Encode the requirement set as constraints and ask a solver about
      consistency, redundancy, gaps, or a witness for a claim.
    evidence_kind: Static
    applicability:
      characteristics: [requirement-set, consistency, decidable]
    tooling: [Z3, CVC5]
  model-checking:
    name: Temporal model checking
    class: Analysis
    definition: >-
      Exhaustively check a temporal property against a state model, returning a
      counterexample trace rather than a pass.
    evidence_kind: Static
    applicability:
      characteristics: [temporal, liveness, safety, state-machine]
    tooling: [Kind2, nuXmv, TLA+]

  # ── Inspection and Demonstration: acts a person performs ──
  inspection:
    name: Inspection
    class: Inspection
    definition: >-
      A person reads the artifact against the requirement and records a
      verdict. Produces no source symbol, so it is discharged through the
      inspections registry rather than by a tagged test.
    evidence_kind: Manual
    applicability:
      characteristics: [judgement-required, no-executable-oracle]
    tooling: [inspections registry]
  demonstration:
    name: Demonstration
    class: Demonstration
    definition: >-
      The system is operated in front of a witness and observed to do the
      thing. Produces no source symbol.
    evidence_kind: Manual
    applicability:
      characteristics: [stakeholder-acceptance, user-visible]
    tooling: [inspections registry]
  agent-behaviour-eval:
    name: Agent-behaviour evaluation
    class: Demonstration
    definition: >-
      Drive a real agent through a scenario and score the transcript against
      the criterion, for a requirement whose subject is an agent's behaviour.
    evidence_kind: Eval
    applicability:
      characteristics: [agent-behaviour, non-deterministic-subject]
    tooling: [eval harness]
