manifest_version: 1.0.0
name: spec-artifacts-process
version: 0.1.0
description: "Filament Module: process artifact templates (ADR, Plan, Task, Review, Finding, TestMatrix, Standard) \u2014 Jinja .md.j2 templates"
archetypes:
- kind: adr
  name: ADR
  doc_backed: true
  supports_membership: false
  composition:
    states:
    - proposed
    - accepted
    - superseded
    - rejected
- kind: plan
  name: Plan
  doc_backed: true
  supports_membership: true
  composition:
    expected_artifacts:
    - Task
- kind: review
  name: Review
  doc_backed: true
  supports_membership: true
  composition:
    expected_artifacts:
    - Finding
    nav:
      top_level: true
      order: 12
- kind: spec-review
  name: SpecReview
  doc_backed: true
  supports_membership: false
  composition:
    nav:
      top_level: true
      order: 13
- kind: test-matrix
  name: Test Matrix
  doc_backed: true
  supports_membership: false
- kind: standard
  name: Standard
  doc_backed: true
  supports_membership: false
grammars:
- name: process-artifacts
  version: 0.1.0
  description: Process artifacts grammar (ADR, plan, review, etc.)
  doc_kinds:
  - adr
  - plan
  - review
  - spec-review
  - test-matrix
  - standard
  - finding
  - feedback
artifact_types:
- name: ADR
  grammar_ref: process-artifacts
  frontmatter_schema_ref: schemas/adr-frontmatter.schema.json
  defaults:
    id_pattern: ADR-{next:03d}
  allowed_links:
  - supersedes
  - superseded_by
  - relates_to
  - depends_on
  examples: []
  lint_rules_ref: []
- name: Plan
  grammar_ref: process-artifacts
  frontmatter_schema_ref: schemas/plan-frontmatter.schema.json
  defaults:
    id_pattern: Plan-{next:03d}
  allowed_links:
  - contains
  - depends_on
  - references
  examples: []
  lint_rules_ref: []
- name: Task
  grammar_ref: process-artifacts
  frontmatter_schema_ref: schemas/task-frontmatter.schema.json
  defaults:
    id_pattern: Task-{next:03d}
  allowed_links:
  - depends_on
  - verifies
  - references
  examples: []
  lint_rules_ref: []
- name: Review
  grammar_ref: process-artifacts
  frontmatter_schema_ref: schemas/review-frontmatter.schema.json
  defaults:
    id_pattern: Review-{next:03d}
  allowed_links:
  - reviews
  - references
  examples: []
  lint_rules_ref: []
- name: SpecReview
  grammar_ref: process-artifacts
  frontmatter_schema_ref: schemas/spec-review-frontmatter.schema.json
  defaults:
    id_pattern: SR-{next:03d}
  allowed_links:
  - reviews
  - references
  examples: []
  lint_rules_ref: []
  body_extraction:
    yield_pattern:
      match:
        summary:
          from: section_body
          after_heading: Summary
          required: true
        findings:
          from: table_row
          under_section: Findings
          required: true
          multiple: true
          assert:
            columns: [ID, Severity, Summary, Refs]
            min_rows: 1
            id_column: ID
            id_pattern: '^FND-\d+$'
            column_choices:
              Severity: [low, medium, high]
- name: Finding
  grammar_ref: process-artifacts
  frontmatter_schema_ref: schemas/finding-frontmatter.schema.json
  defaults:
    id_pattern: Finding-{next:03d}
  allowed_links:
  - found_in
  - blocks
  - references
  examples: []
  lint_rules_ref: []
- name: Feedback
  grammar_ref: process-artifacts
  frontmatter_schema_ref: schemas/feedback-frontmatter.schema.json
  defaults:
    id_pattern: FB-{next:03d}
  allowed_links:
  - references
  - found_in
  examples: []
  lint_rules_ref: []
  body_extraction:
    yield_pattern:
      match:
        comment:
          from: section_body
          after_heading: Comment
          required: true
- name: TestMatrix
  grammar_ref: process-artifacts
  frontmatter_schema_ref: schemas/testmatrix-frontmatter.schema.json
  defaults:
    id_pattern: TestMatrix-{next:03d}
  allowed_links:
  - covers
  - references
  examples: []
  lint_rules_ref: []
  # FR-003: structural + vocabulary contract over the matrix the quoin
  # `spec-matrix` template emits. Whether a referenced requirement id exists is
  # the engine's cross-reference job, not this contract's.
  body_extraction:
    yield_pattern:
      match:
        functional_coverage:
          from: table_row
          under_section: Functional Requirement Coverage
          required: true
          multiple: true
          assert:
            columns: [Functional Req, Acceptance Criteria, Test Cases, Coverage Status]
            min_rows: 1
        test_cases:
          from: table_row
          under_section: Test Case Summary
          required: true
          multiple: true
          assert:
            columns: [Test ID, Title, Type, Priority, Traces To, Status]
            # CR-018: `Priority` is the one asserted column much of the corpus
            # never authored — 49 of 169 ecosystem matrices carry real test-case
            # rows with no priority anywhere. Requiring it would either fail all
            # 49 forever or force an invented priority into each. The column
            # stays declared, and its values stay constrained when authored;
            # only its presence is optional (quire-rs FR-033-AC-14/15).
            optional_columns: [Priority]
            min_rows: 1
            id_column: Test ID
            # CR-016: segmented ids the ecosystem authors (TC-060-01,
            # TC-SB-001, TC-001-HEADER-PARSE) are legal; TC1 / tc-001 / TC- /
            # TCX-001 and ids carrying prose are not.
            #
            # CR-019: the prefix set mirrors the declared *evidence archetypes*
            # — `TC` and `IT` are the only two artifact types any module mints
            # test ids for (spec-artifacts-iso `id_pattern: TC-{next:03d}` /
            # `IT-{next:03d}`). It is deliberately not a list of test kinds:
            # what kind of testing a row records is the `Type` column's job,
            # and that vocabulary is open. A new technique is a new `Type`
            # value, not a new prefix.
            id_pattern: '^(TC|IT)(-[A-Za-z0-9]+)*-\d+[A-Za-z0-9]*(-[A-Za-z0-9]+)*$'
            column_choices:
              # Core evidence vocabulary + this module's declared extensions.
              # The list mirrors `traceability.vocabularies.test_type`, which is
              # the single source; `test_manifest.py` asserts they agree.
              Type: [Unit, Integration, E2E, Property, Fuzz, Benchmark, Static, Compile, Snapshot, Manual]
              Priority: [P0, P1, P2, P3, P4]
            column_patterns:
              # A leading status marker, optionally followed by the note that
              # says why (`⚠️ scale evidence deferred`). Classes live in
              # `traceability.status`.
              Status: '^(✅|⚠️|❌|🚧|⛔)(\s+.*)?$'
              # Comma-separated `<KIND>-<N>` tokens with an optional
              # `-<SUBKIND>-<M>` sub-id. The contract enumerates no kind names:
              # the legal set follows from the declared trace targets, and
              # existence is checked by reference resolution, not here. A
              # same-prefix range or a trailing parenthetical note is allowed.
              #
              # CR-017 admits two authoring shorthands the sweep found in real
              # matrices (report: reports/2026-08-06-fr003-signoff-gate.md):
              #   * continuation, where the parent id is elided —
              #     `FR-001-AC-2, -AC-3, -AC-4`
              #   * slash enumeration of sub-ids — `FR-016-AC-1/2/3/6`
              # Both mean exactly what the expanded list means. Deliberately NOT
              # admitted: an empty cell or `—`. A test case that traces to
              # nothing is what a traceability matrix exists to catch.
              Traces To: '^[A-Za-z]+-\d+(-[A-Za-z]+-\d+(/\d+)*)?(\.\.[A-Za-z]+-\d+(-[A-Za-z]+-\d+)?)?( \([^)]*\))?(, (-[A-Za-z]+-\d+(/\d+)*|[A-Za-z]+-\d+(-[A-Za-z]+-\d+(/\d+)*)?(\.\.[A-Za-z]+-\d+(-[A-Za-z]+-\d+)?)?)( \([^)]*\))?)*$'
        # Optional: the spec-matrix template emits these unconditionally, but a
        # bundle with no StR/US/NFR artifacts cannot truthfully populate them.
        # Absent is fine; present is asserted.
        stakeholder_coverage:
          from: table_row
          under_section: Stakeholder Requirement Coverage
          required: false
          multiple: true
          assert:
            columns: [Stakeholder Req, Trace to US/FR, Test/Validation, Coverage Status]
        user_story_coverage:
          from: table_row
          under_section: User Story Coverage
          required: false
          multiple: true
          assert:
            columns: [User Story, Acceptance Criteria, Test Cases, Coverage Status]
        non_functional_coverage:
          from: table_row
          under_section: Non-Functional Requirement Coverage
          required: false
          multiple: true
          assert:
            columns: [Non-Functional Req, Verification Method, Evidence/Test Cases, Status]
- name: Standard
  grammar_ref: process-artifacts
  frontmatter_schema_ref: schemas/standard-frontmatter.schema.json
  defaults:
    id_pattern: Standard-{next:03d}
  allowed_links:
  - references
  examples: []
  lint_rules_ref: []
doc_kinds:
- adr
- plan
- review
- spec-review
- test-matrix
- standard
- finding
- feedback
object_types:
- name: standard
  data_schema:
    type: object
    properties:
      code:
        type: string
      name:
        type: string
      description:
        type: string
      guide:
        type: string
      link:
        type: string
    required:
    - code
  body_extraction:
    yield_pattern:
      match:
        id:
          from: frontmatter_field
          path:
          - id
          required: false
        title:
          from: frontmatter_field
          path:
          - title
          required: false
        type:
          from: frontmatter_field
          path:
          - type
          required: false
        code:
          from: frontmatter_field
          path:
          - code
          required: true
        name:
          from: frontmatter_field
          path:
          - name
          required: false
        link:
          from: frontmatter_field
          path:
          - link
          required: false
        description:
          from: section_body
          after_heading: Description
          required: false
        guide:
          from: section_body
          after_heading: Application Guidance
          required: false
  allowed_links:
    references: []
lint_rules: []

# ── Traceability model (quire-rs FR-050) ──────────────────────────────────
# The single source for what this module's matrix columns mean. The TestMatrix
# `body_extraction` above validates the *shape*; these declarations tell the
# coverage rollup how to read the same columns, so a contract and its coverage
# computation cannot drift (CR-015 / CR-016).
traceability:
  # ── What mints trace ids ──
  #
  # The Test Matrix is bound by **path**, not by archetype, and both halves of
  # that are the finding (#22 decision 4):
  #
  #   * `archetype: TestMatrix` cannot see the canonical matrix at all. The
  #     corpus walk skips every file named `tests.md` outright — quire-rs
  #     `corpus/walk.rs` `DEFAULT_SKIP = ["README.md", "tests.md"]`, inherited
  #     from the Python loader's `_DEFAULT_SKIP` — and `spec/tests.md` is what
  #     most repos in this ecosystem call their Test Matrix.
  #   * Worse, archetype binding sees matrices that are *test data*. Scanning
  #     this module's own repo by archetype minted 67 test-case ids from
  #     `tests/fixtures/testmatrix/*.md` — deliberately malformed documents —
  #     and reported 50 of them "backed", because a fixture reusing `TC-017`
  #     collides with the real `TC-017`. A phantom backed row is precisely the
  #     lie this rollup exists to catch, so the fixture-blind form does not ship.
  #
  # Paths, therefore, and one entry per name the ecosystem actually uses. An
  # entry declares exactly one origin (`TraceabilityModel::validate` rejects
  # both), so each matrix filename gets its own entry; an absent file simply
  # contributes no rows.
  trace_targets:
  - name: test-case
    document: spec/tests.md
    section: Test Case Summary
    id_column: Test ID
  - name: test-case-matrix
    document: spec/matrix.md
    section: Test Case Summary
    id_column: Test ID
  - name: test-case-evals
    document: spec/evals.md
    section: Test Case Summary
    id_column: Test ID
  - name: acceptance-criterion
    archetype: FR
    section: Acceptance Criteria
    id_column: ID
  - name: nfr-acceptance-criterion
    archetype: NFR
    section: Acceptance Criteria
    id_column: ID
  # Requirement documents stay archetype-bound: they are ordinary corpus
  # documents, the walk does not skip them, and no fixture in the ecosystem is
  # typed `FR`/`NFR`.
  #
  # Deliberately not minted: `US` criteria are authored as a bullet list, not a
  # table, and `declared_tables::scan` reads tables only; `StR` criteria sit
  # under `## Validation Criteria` with a `Validation` column and are validated
  # by review rather than by a test. Neither is a denominator a test tag could
  # ever satisfy, and a denominator nothing can satisfy is noise.

  # ── What references those ids ──
  #
  # `expand_ranges` and `strip_annotations` are opt-in per declaration
  # (FR-050-AC-12) and both are needed here: the corpus authors
  # `FR-001-AC-1 .. FR-001-AC-4` and `TC-024 (blocked: no uniqueness assert)`.
  #
  # Known limit, recorded rather than papered over: the two CR-017 authoring
  # shorthands the *shape* contract admits — continuation (`FR-001-AC-2, -AC-3`)
  # and slash enumeration (`FR-016-AC-1/2/3`) — are not expanded by the engine,
  # so such a cell contributes its first token only. The row is still backed
  # when that token is backed; it just under-counts the rest.
  document_references:
  # Most `Verification` cells carry no test id at all — a sweep over quire-rs,
  # quoin and this repo found 285 bare `Test`, 99 `Test (TC-nnn)`, and ~100
  # naming a file rather than an id (`Test (org.test.ts)`), plus `Eval (EV-nnn)`.
  # The pattern extracts what is there; a row naming no id is still answerable
  # for its own criterion id, which is what a tag on the test binds.
  - name: verification
    archetype: FR
    section: Acceptance Criteria
    column: Verification
    row_id_column: ID
    pattern: '\b((?:TC|IT)(?:-[A-Za-z0-9]+)*-\d+[A-Za-z0-9]*)\b'
    targets: [test-case, test-case-matrix, test-case-evals]
    expand_ranges: true
    strip_annotations: false
  - name: nfr-verification
    archetype: NFR
    section: Acceptance Criteria
    column: Verification
    row_id_column: ID
    pattern: '\b((?:TC|IT)(?:-[A-Za-z0-9]+)*-\d+[A-Za-z0-9]*)\b'
    targets: [test-case, test-case-matrix, test-case-evals]
    expand_ranges: true
    strip_annotations: false
  - name: traces-to
    document: spec/tests.md
    section: Test Case Summary
    column: Traces To
    row_id_column: Test ID
    pattern: '\b([A-Za-z]{2,4}-\d+(?:-[A-Za-z]+-\d+)?)\b'
    targets: [acceptance-criterion, nfr-acceptance-criterion]
    expand_ranges: true
    strip_annotations: true
  - name: traces-to-matrix
    document: spec/matrix.md
    section: Test Case Summary
    column: Traces To
    row_id_column: Test ID
    pattern: '\b([A-Za-z]{2,4}-\d+(?:-[A-Za-z]+-\d+)?)\b'
    targets: [acceptance-criterion, nfr-acceptance-criterion]
    expand_ranges: true
    strip_annotations: true
  - name: traces-to-evals
    document: spec/evals.md
    section: Test Case Summary
    column: Traces To
    row_id_column: Test ID
    pattern: '\b([A-Za-z]{2,4}-\d+(?:-[A-Za-z]+-\d+)?)\b'
    targets: [acceptance-criterion, nfr-acceptance-criterion]
    expand_ranges: true
    strip_annotations: true
  - name: functional-coverage
    document: spec/tests.md
    section: Functional Requirement Coverage
    column: Test Cases
    row_id_column: Functional Req
    pattern: '\b((?:TC|IT)(?:-[A-Za-z0-9]+)*-\d+[A-Za-z0-9]*)\b'
    targets: [test-case, test-case-matrix, test-case-evals]
    expand_ranges: true
    strip_annotations: true
  - name: functional-coverage-matrix
    document: spec/matrix.md
    section: Functional Requirement Coverage
    column: Test Cases
    row_id_column: Functional Req
    pattern: '\b((?:TC|IT)(?:-[A-Za-z0-9]+)*-\d+[A-Za-z0-9]*)\b'
    targets: [test-case, test-case-matrix, test-case-evals]
    expand_ranges: true
    strip_annotations: true
  - name: functional-coverage-evals
    document: spec/evals.md
    section: Functional Requirement Coverage
    column: Test Cases
    row_id_column: Functional Req
    pattern: '\b((?:TC|IT)(?:-[A-Za-z0-9]+)*-\d+[A-Za-z0-9]*)\b'
    targets: [test-case, test-case-matrix, test-case-evals]
    expand_ranges: true
    strip_annotations: true

  # ── How a test carries a trace id (FR-051) ──
  #
  # FR-051 specified all three marker forms and deferred this declaration to
  # "a follow-up change in spec-artifacts-iso". It lands here instead: the rest
  # of the traceability model is already here, the TestMatrix that mints test
  # ids is this module's archetype, and splitting one model across two modules
  # would let the halves version apart (#22 decision 1).
  trace_tags:
    markers:
    - name: rust-trace-attribute
      language: rust
      pattern: '#\[trace\(([^)]*)\)\]'
      template: '#[trace({ids})]'
    - name: pytest-trace-marker
      language: python
      pattern: '@pytest\.mark\.trace\(([^)]*)\)'
      template: '@pytest.mark.trace({ids})'
    - name: ts-trace-helper
      language: typescript
      pattern: '\btrace\(([^)]*)\)'
      template: 'trace({ids})'
    # A legacy form names exactly one `rewrite_to` marker, so a form that spans
    # languages can only ever suggest the wrong syntax for two of the three —
    # the fixture points all of them at `rust-trace-attribute`, which would tell
    # a `.py` file to grow a Rust attribute. Split per language instead, so the
    # suggestion is valid in the file it is offered for (#22 decision 3).
    legacy:
    - name: rust-trace-line
      language: rust
      pattern: 'Trace:\s*([A-Za-z]+-\d+(?:-[A-Za-z]+-\d+)?)'
      rewrite_to: rust-trace-attribute
    - name: python-trace-line
      language: python
      pattern: 'Trace:\s*([A-Za-z]+-\d+(?:-[A-Za-z]+-\d+)?)'
      rewrite_to: pytest-trace-marker
    - name: typescript-trace-line
      language: typescript
      pattern: 'Trace:\s*([A-Za-z]+-\d+(?:-[A-Za-z]+-\d+)?)'
      rewrite_to: ts-trace-helper
    - name: rust-comment-id
      language: rust
      pattern: '//\s*((?:TC|IT|FR|NFR|StR|US)-\d+(?:-[A-Za-z]+-\d+)?)'
      rewrite_to: rust-trace-attribute
    - name: python-comment-id
      language: python
      pattern: '#\s*((?:TC|IT|FR|NFR|StR|US)-\d+(?:-[A-Za-z]+-\d+)?)'
      rewrite_to: pytest-trace-marker
    - name: typescript-comment-id
      language: typescript
      pattern: '//\s*((?:TC|IT|FR|NFR|StR|US)-\d+(?:-[A-Za-z]+-\d+)?)'
      rewrite_to: ts-trace-helper
    - name: rust-test-name-id
      language: rust
      pattern: '\bfn (?i:tc)(\d+)_'
      id_format: 'TC-{1}'
      rewrite_to: rust-trace-attribute
    # FR-051-AC-11's fourth form, "docstring bare id". Anchored to the *first*
    # token of the doc comment, which is the authored convention across the
    # corpus (`"""TC-017 (FR-003-AC-9): the contract is additive."""`). An
    # unanchored form would bind every id a docstring merely mentions in prose,
    # and a test that names a requirement is not a test that verifies it.
    - name: python-docstring-id
      language: python
      pattern: '(?m)^\s*(?:[rbfu]{1,2})?"""\s*((?:TC|IT|FR|NFR|StR|US)-\d+(?:-[A-Za-z]+-\d+)?)'
      rewrite_to: pytest-trace-marker
    - name: rust-doc-comment-id
      language: rust
      pattern: '(?m)^\s*///\s*((?:TC|IT|FR|NFR|StR|US)-\d+(?:-[A-Za-z]+-\d+)?)'
      rewrite_to: rust-trace-attribute
    - name: typescript-doc-comment-id
      language: typescript
      pattern: '(?m)^\s*\*\s*((?:TC|IT|FR|NFR|StR|US)-\d+(?:-[A-Za-z]+-\d+)?)'
      rewrite_to: ts-trace-helper
  status:
    column: Status
    complete: ["✅"]
    pending: ["🚧"]
    failed: ["❌"]
    retired: ["⛔"]
  vocabularies:
    test_type: [Unit, Integration, E2E, Property, Fuzz, Benchmark, Static, Compile, Snapshot, Manual]
